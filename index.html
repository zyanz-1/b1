<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WearLab — 4 Sisi Apparel Designer</title>
<style>
:root{
  --bg:#0b0f14;--panel:#111720;--panel2:#171f2a;--line:#293546;
  --text:#eef3f8;--muted:#8d9aaa;--accent:#5b8cff;--danger:#ef6461;
  --stage:#e9edf2;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:62px 1fr}
.topbar{height:62px;background:#0d1219;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px}.brandIcon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6d96ff,#7c5cff);display:grid;place-items:center;font-weight:900}.brand h1{font-size:15px;margin:0}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.topRight{display:flex;gap:7px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:8px;font-size:12px}.btn:hover{border-color:#4a5d77}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:#ff9d9b}
.layout{min-height:0;display:grid;grid-template-columns:255px 1fr 285px}
.left,.right{background:var(--panel);overflow:auto;padding:15px}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
.section{margin-bottom:22px}.sectionTitle{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.models{display:grid;grid-template-columns:1fr 1fr;gap:7px}.model{border:1px solid var(--line);background:#141b24;color:#cbd5e1;border-radius:8px;padding:8px 4px;text-align:center;font-size:10px}.model.active{background:#182744;border-color:var(--accent);color:white}.modelIcon{font-size:27px;height:35px;display:grid;place-items:center;margin-bottom:3px}
.field{margin:9px 0}.field label{display:flex;justify-content:space-between;color:#aeb9c8;font-size:11px;margin-bottom:5px}.field input[type=color]{width:100%;height:35px;padding:2px;border:1px solid var(--line);border-radius:7px;background:transparent}.field input[type=text],.field input[type=number],.field select{width:100%;background:#0e141c;border:1px solid var(--line);border-radius:7px;color:white;padding:8px;outline:none}.field input[type=range]{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.upload{display:flex;align-items:center;justify-content:center;border:1px dashed #40516a;border-radius:7px;padding:9px;color:#aeb9c8;font-size:11px;min-height:38px}.upload input{display:none}
.center{min-width:0;display:flex;flex-direction:column;background:var(--stage)}
.viewbar{height:70px;background:#f5f7fa;border-bottom:1px solid #cdd4dd;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 12px}
.viewBtn{position:relative;border:1px solid #d3d9e2;background:white;border-radius:8px;color:#596678;font-size:11px;display:flex;align-items:center;justify-content:center;gap:7px}.viewBtn.active{background:#18202b;color:#fff;border-color:#18202b}.viewBtn .dot{width:7px;height:7px;border-radius:50%;background:#aab5c2}.viewBtn.active .dot{background:#6e9aff}
.canvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:30px;background-color:#e8ecf1;background-image:linear-gradient(45deg,#dce1e7 25%,transparent 25%),linear-gradient(-45deg,#dce1e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dce1e7 75%),linear-gradient(-45deg,transparent 75%,#dce1e7 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}
.artboard{width:min(540px,72vw);height:min(650px,76vh);background:#fff;border-radius:10px;box-shadow:0 22px 65px rgba(0,0,0,.15);position:relative;overflow:hidden}
.artboard svg{width:100%;height:100%;display:block}
.stageInfo{height:34px;background:#f5f7fa;border-top:1px solid #ccd3dc;color:#667487;font-size:10px;display:flex;align-items:center;justify-content:center}
.layers{display:flex;flex-direction:column;gap:6px}.layer{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:7px;background:#151d27;color:#d7dee8;font-size:11px}.layer.active{border-color:var(--accent);background:#182744}.layerIcon{width:21px;text-align:center}.layerName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{font-size:11px;color:#687689;text-align:center;line-height:1.5;padding:12px 3px}
.check{display:flex;align-items:center;gap:7px;font-size:11px;color:#b9c4d1}.check input{accent-color:var(--accent)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101721;color:white;border:1px solid #344154;padding:10px 14px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.show{opacity:1!important}
@media(max-width:1050px){.layout{grid-template-columns:220px 1fr 250px}.viewbar{height:60px}}
@media(max-width:800px){.layout{grid-template-columns:1fr}.left,.right{display:none}.center{height:calc(100vh - 62px)}.artboard{width:88vw;height:75vh}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brandIcon">W</div><div><h1>WearLab</h1><small>4-Side Apparel Designer</small></div></div>
  <div class="topRight">
    <button class="btn" onclick="resetAll()">Reset</button>
    <button class="btn primary" onclick="exportAll()">Export 4 Sisi</button>
  </div>
</header>

<div class="layout">
<aside class="left">
  <div class="section">
    <div class="sectionTitle">Jenis Baju</div>
    <div class="models">
      <button class="model active" onclick="changeModel('tee',this)"><div class="modelIcon">👕</div>T-Shirt</button>
      <button class="model" onclick="changeModel('polo',this)"><div class="modelIcon">👔</div>Polo</button>
      <button class="model" onclick="changeModel('long',this)"><div class="modelIcon">👕</div>Long Sleeve</button>
      <button class="model" onclick="changeModel('jersey',this)"><div class="modelIcon">🏃</div>Jersey</button>
      <button class="model" onclick="changeModel('hoodie',this)"><div class="modelIcon">🧥</div>Hoodie</button>
      <button class="model" onclick="changeModel('tank',this)"><div class="modelIcon">🎽</div>Tank Top</button>
    </div>
  </div>

  <div class="section">
    <div class="sectionTitle">Warna Baju</div>
    <div class="field"><label>Badan</label><input id="bodyColor" type="color" value="#20252c" oninput="renderShirt()"></div>
    <div class="field"><label>Lengan / sisi</label><input id="sleeveColor" type="color" value="#181c22" oninput="renderShirt()"></div>
    <div class="field"><label>Kerah</label><input id="collarColor" type="color" value="#11151b" oninput="renderShirt()"></div>
    <div class="field"><label>Garis aksen</label><input id="accentColor" type="color" value="#e84b4b" oninput="renderShirt()"></div>
  </div>

  <div class="section">
    <div class="sectionTitle">Tambahkan Desain</div>
    <div class="grid2">
      <button class="btn" onclick="addText()">＋ Teks</button>
      <label class="upload">＋ Logo<input id="imageInput" type="file" accept="image/*"></label>
      <button class="btn" onclick="addNumber()">＋ Nomor</button>
      <button class="btn" onclick="addStripe()">＋ Stripe</button>
    </div>
  </div>

  <div class="section">
    <div class="sectionTitle">Tampilan</div>
    <label class="check"><input id="shadowToggle" type="checkbox" checked onchange="renderShirt()"> Bayangan kain</label>
    <label class="check" style="margin-top:9px"><input id="seamToggle" type="checkbox" checked onchange="renderShirt()"> Jahitan / detail</label>
  </div>

  <div class="section">
    <div class="sectionTitle">Petunjuk</div>
    <div class="empty">Pilih salah satu dari 4 sisi di atas. Tambahkan logo atau teks, lalu drag langsung pada baju untuk memindahkannya.</div>
  </div>
</aside>

<main class="center">
  <div class="viewbar">
    <button class="viewBtn active" id="vFront" onclick="setView('front')"><span class="dot"></span>DEPAN</button>
    <button class="viewBtn" id="vBack" onclick="setView('back')"><span class="dot"></span>BELAKANG</button>
    <button class="viewBtn" id="vLeft" onclick="setView('left')"><span class="dot"></span>SISI KIRI</button>
    <button class="viewBtn" id="vRight" onclick="setView('right')"><span class="dot"></span>SISI KANAN</button>
  </div>

  <div class="canvas">
    <div class="artboard">
      <svg id="svg" viewBox="0 0 600 750" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-opacity=".16"/></filter>
          <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".12"/><stop offset=".16" stop-color="#fff" stop-opacity=".035"/><stop offset=".55" stop-color="#fff" stop-opacity=".015"/><stop offset="1" stop-color="#000" stop-opacity=".13"/></linearGradient>
        </defs>
        <rect width="600" height="750" fill="#fff"/>
        <ellipse id="groundShadow" cx="300" cy="675" rx="185" ry="22" fill="#000" opacity=".10"/>
        <g id="shirtGroup" filter="url(#shadow)"></g>
        <g id="designLayer"></g>
        <g id="seamLayer"></g>
      </svg>
    </div>
  </div>
  <div class="stageInfo"><span id="viewLabel">DEPAN</span>&nbsp; • &nbsp;<span id="modelLabel">T-SHIRT</span></div>
</main>

<aside class="right">
  <div class="section">
    <div class="sectionTitle">Layer — <span id="sideLabel">Depan</span></div>
    <div id="layers" class="layers"></div>
  </div>

  <div class="section" id="props" style="display:none">
    <div class="sectionTitle">Properti Elemen</div>
    <div class="field"><label>Nama</label><input id="pName" type="text" oninput="updateSelected()"></div>
    <div class="field"><label>Ukuran <span id="pSizeVal"></span></label><input id="pSize" type="range" min="10" max="240" oninput="updateSelected()"></div>
    <div class="field"><label>Posisi X <span id="pXVal"></span></label><input id="pX" type="range" min="20" max="580" oninput="updateSelected()"></div>
    <div class="field"><label>Posisi Y <span id="pYVal"></span></label><input id="pY" type="range" min="40" max="690" oninput="updateSelected()"></div>
    <div class="field"><label>Rotasi <span id="pRVal"></span></label><input id="pR" type="range" min="-180" max="180" oninput="updateSelected()"></div>
    <div class="field" id="colorField"><label>Warna elemen</label><input id="pColor" type="color" value="#ffffff" oninput="updateSelected()"></div>
    <button class="btn danger" style="width:100%" onclick="deleteSelected()">Hapus Elemen</button>
  </div>

  <div class="section">
    <div class="sectionTitle">Ringkasan 4 Sisi</div>
    <div class="grid2">
      <button class="btn" onclick="setView('front')">Depan</button>
      <button class="btn" onclick="setView('back')">Belakang</button>
      <button class="btn" onclick="setView('left')">Kiri</button>
      <button class="btn" onclick="setView('right')">Kanan</button>
    </div>
  </div>
</aside>
</div>
</div>
<div id="toast"></div>

<script>
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
let model="tee", view="front", selected=null, seq=0, dragging=false;
const sides=["front","back","left","right"];
const designs={front:[],back:[],left:[],right:[]};

function toast(t){const x=$("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1400)}
function sideName(){return {front:"Depan",back:"Belakang",left:"Sisi Kiri",right:"Sisi Kanan"}[view]}

function setView(v){
  view=v;selected=null;
  ["front","back","left","right"].forEach(s=>$("v"+s[0].toUpperCase()+s.slice(1)).classList.toggle("active",s===v));
  $("viewLabel").textContent=sideName().toUpperCase();$("sideLabel").textContent=sideName();
  renderDesigns();renderLayers();syncProps();
}

function changeModel(m,btn){
  model=m;document.querySelectorAll(".model").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
  $("modelLabel").textContent=({tee:"T-SHIRT",polo:"POLO",long:"LONG SLEEVE",jersey:"JERSEY",hoodie:"HOODIE",tank:"TANK TOP"})[m];
  renderShirt();
}

function path(parent,tag,attrs){
  const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;
}

function renderShirt(){
  const g=$("shirtGroup"),seam=$("seamLayer");g.innerHTML="";seam.innerHTML="";
  const body=$("bodyColor").value,sleeve=$("sleeveColor").value,collar=$("collarColor").value,accent=$("accentColor").value;
  const shadow=$("shadowToggle").checked, seams=$("seamToggle").checked;
  $("groundShadow").setAttribute("opacity",shadow?".10":"0");
  const fill=(d)=>path(g,"path",{d,fill:body,stroke:"#171b21","stroke-width":"3"});
  const sleeve=(d)=>path(g,"path",{d,fill:sleeve,stroke:"#171b21","stroke-width":"3"});
  const line=(d,color=collar,w=10)=>path(g,"path",{d,fill:"none",stroke:color,"stroke-width":w,"stroke-linecap":"round","stroke-linejoin":"round"});
  const detail=(d,color="#fff",w=2,dash="")=>path(seam,"path",{d,fill:"none",stroke:color,"stroke-width":w,"stroke-linecap":"round",...(dash?{"stroke-dasharray":dash}:{})});

  if(view==="front"||view==="back"){
    if(model==="tee"){
      sleeve("M205 145 L85 210 L125 335 L220 270 Z");sleeve("M395 145 L515 210 L475 335 L380 270 Z");
      fill("M205 140 L250 115 L350 115 L395 140 L385 650 Q300 670 215 650 Z");line("M250 120 Q300 175 350 120",collar,15);
    }else if(model==="polo"){
      sleeve("M205 145 L85 210 L125 335 L220 270 Z");sleeve("M395 145 L515 210 L475 335 L380 270 Z");
      fill("M205 140 L250 115 L350 115 L395 140 L385 650 Q300 670 215 650 Z");line("M250 120 Q300 168 350 120",collar,13);
      if(view==="front"){path(g,"path",{d:"M300 125 L300 220",stroke:collar,"stroke-width":"5"});path(g,"circle",{cx:300,cy:145,r:4,fill:accent});path(g,"circle",{cx:300,cy:170,r:4,fill:accent});}
    }else if(model==="long"){
      sleeve("M205 145 L65 220 L100 450 L165 420 L145 270 L220 225 Z");sleeve("M395 145 L535 220 L500 450 L435 420 L455 270 L380 225 Z");
      fill("M205 140 L250 115 L350 115 L395 140 L385 650 Q300 670 215 650 Z");line("M250 120 Q300 175 350 120",collar,15);
    }else if(model==="jersey"){
      sleeve("M205 145 L70 210 L120 355 L220 280 Z");sleeve("M395 145 L530 210 L480 355 L380 280 Z");
      fill("M205 140 L250 115 L350 115 L395 140 L425 650 Q300 675 175 650 Z");line("M250 120 Q300 160 350 120",collar,10);
      path(g,"path",{d:"M175 275 L425 275",stroke:accent,"stroke-width":"9",opacity:".9"});
    }else if(model==="hoodie"){
      sleeve("M205 150 L65 225 L115 415 L175 380 L150 275 L220 230 Z");sleeve("M395 150 L535 225 L485 415 L425 380 L450 275 L380 230 Z");
      fill("M205 145 L245 105 L355 105 L395 145 L415 650 Q300 680 185 650 Z");line("M245 110 Q300 220 355 110",collar,27);
      if(view==="front")path(g,"path",{d:"M300 165 L300 235",stroke:accent,"stroke-width":"3"});
    }else{
      fill("M205 140 L250 115 L350 115 L395 140 L375 650 Q300 670 225 650 Z");line("M250 120 Q300 175 350 120",collar,13);
    }
    // vertical accent piping
    if(view==="front"||view==="back"){
      detail("M195 160 L190 620",accent,4);detail("M215 155 L210 625",accent,2);
      detail("M405 160 L410 620",accent,4);detail("M385 155 L390 625",accent,2);
    }
    if(seams){detail("M220 645 Q300 660 380 645","#777",1,"5 5");detail("M205 145 L220 270","#777",1,"4 4");detail("M395 145 L380 270","#777",1,"4 4");}
  }else{
    // side views — simplified silhouette inspired by the supplied reference
    if(model==="long"||model==="hoodie"){
      fill(view==="left"?"M250 120 Q205 145 185 205 L185 625 Q220 650 285 645 L300 150 Z":"M350 120 Q395 145 415 205 L415 625 Q380 650 315 645 L300 150 Z");
      if(view==="left")sleeve("M250 145 Q185 170 150 250 L175 365 L220 340 L215 230 L285 175 Z");
      else sleeve("M350 145 Q415 170 450 250 L425 365 L380 340 L385 230 L315 175 Z");
    }else{
      fill(view==="left"?"M265 120 Q215 145 190 205 L190 630 Q235 650 300 645 L300 150 Z":"M335 120 Q385 145 410 205 L410 630 Q365 650 300 645 L300 150 Z");
      if(model!=="tank"){
        if(view==="left")sleeve("M265 145 Q215 170 175 245 L190 340 L230 330 L225 230 L285 175 Z");
        else sleeve("M335 145 Q385 170 425 245 L410 340 L370 330 L375 230 L315 175 Z");
      }
    }
    line("M285 125 Q300 145 315 125",collar,10);
    if(seams){detail(view==="left"?"M195 210 L195 610":"M405 210 L405 610","#777",1,"5 5")}
  }
  renderDesigns();
}

function addText(){
  const o={id:"e"+(++seq),type:"text",name:"Teks",x:300,y:350,size:45,rot:0,color:"#fff",text:"YOUR TEXT"};
  designs[view].push(o);selected=o;renderDesigns();renderLayers();syncProps();
}
function addNumber(){
  const o={id:"e"+(++seq),type:"text",name:"Nomor",x:300,y:450,size:110,rot:0,color:"#fff",text:"10"};
  designs[view].push(o);selected=o;renderDesigns();renderLayers();syncProps();
}
function addStripe(){
  const o={id:"e"+(++seq),type:"stripe",name:"Stripe",x:300,y:330,size:110,rot:0,color:$("accentColor").value};
  designs[view].push(o);selected=o;renderDesigns();renderLayers();syncProps();
}
$("imageInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    const o={id:"e"+(++seq),type:"image",name:f.name,x:300,y:300,size:120,rot:0,src:r.result};
    designs[view].push(o);selected=o;renderDesigns();renderLayers();syncProps();toast("Logo ditambahkan");
  };r.readAsDataURL(f);e.target.value="";
});

function renderDesigns(){
  const dl=$("designLayer");dl.innerHTML="";
  designs[view].forEach(o=>{
    let e;
    if(o.type==="text"){
      e=path(dl,"text",{x:o.x,y:o.y,"font-size":o.size,"font-family":"Arial, sans-serif","font-weight":"800","text-anchor":"middle",fill:o.color,transform:`rotate(${o.rot} ${o.x} ${o.y})`});e.textContent=o.text;
    }else if(o.type==="image"){
      e=path(dl,"image",{href:o.src,x:o.x-o.size/2,y:o.y-o.size/2,width:o.size,height:o.size,preserveAspectRatio:"xMidYMid meet",transform:`rotate(${o.rot} ${o.x} ${o.y})`});
    }else{
      e=path(dl,"rect",{x:95,y:o.y-o.size/10,width:410,height:o.size/5,rx:5,fill:o.color,opacity:".88",transform:`rotate(${o.rot} 300 ${o.y})`});
    }
    e.dataset.id=o.id;e.style.cursor="move";e.addEventListener("mousedown",ev=>{ev.stopPropagation();selected=o;syncProps();renderLayers()});
  });
}
function renderLayers(){
  const b=$("layers");b.innerHTML="";
  if(!designs[view].length){b.innerHTML='<div class="empty">Belum ada elemen pada sisi ini.</div>';return}
  [...designs[view]].reverse().forEach(o=>{
    const d=document.createElement("div");d.className="layer"+(selected?.id===o.id?" active":"");
    d.innerHTML=`<div class="layerIcon">${o.type==="image"?"🖼":o.type==="stripe"?"▰":"T"}</div><div class="layerName">${o.name}</div>`;
    d.onclick=()=>{selected=o;syncProps();renderLayers()};b.appendChild(d);
  });
}
function syncProps(){
  $("props").style.display=selected?"block":"none";if(!selected)return;
  $("pName").value=selected.name;$("pSize").value=selected.size;$("pX").value=selected.x;$("pY").value=selected.y;$("pR").value=selected.rot;
  $("pSizeVal").textContent=selected.size;$("pXVal").textContent=Math.round(selected.x);$("pYVal").textContent=Math.round(selected.y);$("pRVal").textContent=selected.rot+"°";
  $("colorField").style.display=selected.type==="image"?"none":"block";if(selected.type!=="image")$("pColor").value=selected.color;
}
function updateSelected(){
  if(!selected)return;
  selected.name=$("pName").value;selected.size=+$("pSize").value;selected.x=+$("pX").value;selected.y=+$("pY").value;selected.rot=+$("pR").value;
  if(selected.type!=="image")selected.color=$("pColor").value;
  if(selected.type==="text")selected.text=selected.name==="Nomor"?"10":selected.name;
  renderDesigns();renderLayers();syncProps();
}
function deleteSelected(){if(!selected)return;designs[view]=designs[view].filter(x=>x.id!==selected.id);selected=null;renderDesigns();renderLayers();syncProps()}

function point(e){
  const r=$("svg").getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*750};
}
$("svg").addEventListener("mousedown",e=>{if(selected&&e.target.dataset.id===selected.id)dragging=true});
window.addEventListener("mousemove",e=>{
  if(!dragging||!selected)return;
  const p=point(e);selected.x=Math.max(20,Math.min(580,p.x));selected.y=Math.max(40,Math.min(690,p.y));renderDesigns();syncProps();
});
window.addEventListener("mouseup",()=>dragging=false);

function resetAll(){
  sides.forEach(s=>designs[s]=[]);selected=null;seq=0;model="tee";
  $("bodyColor").value="#20252c";$("sleeveColor").value="#181c22";$("collarColor").value="#11151b";$("accentColor").value="#e84b4b";
  document.querySelectorAll(".model").forEach(x=>x.classList.remove("active"));document.querySelector(".model").classList.add("active");
  setView("front");renderShirt();toast("Semua desain direset");
}

function svgToData(){
  const clone=$("svg").cloneNode(true);clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(clone));
}
function exportAll(){
  // Generate a 2x2 contact sheet of the four sides.
  const imgs=[];let loaded=0;
  sides.forEach((s,i)=>{
    const old=view;view=s;renderDesigns();const src=svgToData();view=old;renderDesigns();
    const im=new Image();im.onload=()=>{imgs[i]=im;if(++loaded===4){
